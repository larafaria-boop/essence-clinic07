<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Agendamento - Essence Clinic</title>

<link rel="stylesheet" href="style.css">


</head>

<body>
    <header>

        <h1>🌸Agendamento</h1>

        <nav>
            <a href="index.html">Início</a> |
            <a href="catalogo.html">Catálogo</a> |
            <a href="agendamento.html">Agendamento</a> |
            <a href="sobre.html">Sobre Nós</a> |
            <a href="contato.html">Contato</a>
        </nav>

    </header>

    <main>

        <section>

            <h2>Agende seu horário!</h2>

            <p>
                Preencha o formulário para solicitar seu atendimento.
            </p>

            <form>


                <label for="nome">👤Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>

                <br><br>

                <label for="procedimento">✨Escolha o procedimento:</label>

                <select id="procedimento" name="procedimento">

                    <option value="">Selecione</option>
                    <option value="limpeza">Limpeza de pele</option>
                    <option value="massagem">Massagem relaxante</option>
                    <option value="drenagem">Drenagem corporal</option>
                    <option value="sobrancelhas">Design de sobrancelhas</option>

                </select>

                <br>

                <label for="data">📅Data do atendimento:</label>
                <input type="date" id="data" name="data" required>

                <br>

                <label for="telefone">📞Telefone:</label>
                <input type="tel" id="telefone" name="telefone" required inputmode="numeric" maxlength="15"
                    pattern="(?:\(?[1-9]{2}\)?\s?)?(?:9\d{4}|\d{4})-?\d{4}"
                    title="Digite com DDD. EX:(17)98765-4321 ou 17987654321">

                <br>

                <label for="email">📧E-mail:</label>
                <input type="email" id="email" name="email">

                <br>

                <button type="submit">Agendar horário</button>

            </form>

        </section>

    </main>

    <footer>

        <p>&copy;🌷Essence Clinic - Cuidando de você.</p>

    </footer>

</body>

</html>
